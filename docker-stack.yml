version: "3.8"

services:
  keycloak-db:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command:
      - start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    networks:
      - backend
    depends_on:
      - keycloak-db
    deploy:
      placement:
        constraints:
          - node.role == manager

  profile-db:
    image: postgres:15
    environment:
      POSTGRES_DB: profile
      POSTGRES_USER: profile
      POSTGRES_PASSWORD: profile
    volumes:
      - profile-data:/var/lib/postgresql/data
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - backend
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      placement:
        constraints:
          - node.role == manager

  auth-service:
    build: .
    image: auth-service:latest
    networks:
      - backend
    ports:
      - "5001:5001"
    depends_on:
      - keycloak
      - profile-db
      - rabbitmq

    secrets:
      - gmail_app_pass_v2

    environment:
      IN_DOCKER: "1"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "proiect-scd"
      KEYCLOAK_CLIENT_ID: "backend-scd"
      KEYCLOAK_SECRET: "U5oQeJxCCOl0Ta7soM6Gmd7V9RR3y8Rs"

      # ✅ Gmail SMTP
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_USE_TLS: "1"
      SMTP_USER: "marioalexn@gmail.com"
      SMTP_PASS_FILE: "/run/secrets/gmail_app_pass_v2"
      SMTP_FROM: "Sistem Concedii <marioalexn@gmail.com>"
      SMTP_TIMEOUT: "20"

      # ✅ RabbitMQ
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      EXPENSES_EXCHANGE: "expenses"
      EXPENSES_ROUTING_KEY: "expense.requested"

      # ✅ Stripe (pune cheia ta test)
      STRIPE_SECRET_KEY: ""

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  expense-worker:
    build: .
    image: expense-worker:latest
    networks:
      - backend
    depends_on:
      - profile-db
      - rabbitmq
    command: ["python", "expense_worker.py"]
    environment:
      IN_DOCKER: "1"

      # DB (worker-ul folosește aceeași configurație ca app.py)
      DB_USER: "profile"
      DB_PASS: "profile"
      DB_NAME: "profile"

      # ✅ RabbitMQ
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      EXPENSES_EXCHANGE: "expenses"
      EXPENSES_QUEUE: "expenses.process"
      EXPENSES_BIND_KEY: "expense.requested"

      # ✅ Events către notificări
      NOTIFY_EXCHANGE: "notifications"
      NOTIFY_ROUTING_KEY: "notify.expense"

      # ✅ Stripe
      STRIPE_SECRET_KEY: ""

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  backend:

volumes:
  keycloak-data:
  profile-data:

secrets:
  gmail_app_pass_v2:
    external: true
