version: "3.8"

services:
  keycloak-db:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    networks:
      - frontend-net

  profile-db:
    image: postgres:15
    environment:
      POSTGRES_DB: profile
      POSTGRES_USER: profile
      POSTGRES_PASSWORD: profile
    volumes:
      - profile-data:/var/lib/postgresql/data
    networks:
      - backend-net
      - worker-net

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend-net
      - worker-net

  redis:
    image: redis:7
    networks:
      - backend-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    networks:
      - frontend-net
    depends_on:
      - keycloak-db

  auth-service:
    build: .
    image: auth-service:latest
    ports:
      - "5001:5001"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - keycloak
      - profile-db
      - rabbitmq
      - redis
    environment:
      IN_DOCKER: "1"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "proiect-scd"
      KEYCLOAK_CLIENT_ID: "backend-scd"
      KEYCLOAK_SECRET: "4ADOvx6B7aRogJqzAbS3Qq8mQe4fTDrQ"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_USE_TLS: "1"
      SMTP_USER: "marioalexn@gmail.com"
      SMTP_PASS: "parola_ta_aici" 
      SMTP_FROM: "Sistem Concedii <marioalexn@gmail.com>"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      EXPENSES_EXCHANGE: "expenses"
      EXPENSES_ROUTING_KEY: "expense.requested"
      REDIS_URL: "redis://redis:6379/0"

  expense-worker:
    build: .
    image: expense-worker:latest
    command: ["python", "expense_worker.py"]
    networks:
      - worker-net
    depends_on:
      - profile-db
      - rabbitmq
    environment:
      IN_DOCKER: "1"
      DB_USER: "profile"
      DB_PASS: "profile"
      DB_NAME: "profile"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      EXPENSES_EXCHANGE: "expenses"
      EXPENSES_QUEUE: "expenses.process"
      EXPENSES_BIND_KEY: "expense.requested"
      NOTIFY_EXCHANGE: "notifications"
      NOTIFY_ROUTING_KEY: "notify.expense"
    deploy:
      replicas: 2

networks:
  frontend-net:
  backend-net:
  worker-net:

volumes:
  keycloak-data:
  profile-data: